name: Rakazo IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - name: Build unsigned IPA
        env:
          EXPO_PUBLIC_API_URL: https://app.rakazo.com
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/elie222/rakazo.git src
          cd src
          npm i -g pnpm@12.18.0
          pnpm install --frozen-lockfile
          cd apps/mobile
          pnpm exec expo install --check || echo "::warning::expo patch-level version drift ignored (app.config.ts is dynamic, so --fix cannot write it)"
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install --repo-update || pod install
          xcodebuild -list -workspace Rakazo.xcworkspace || true
          xcodebuild -workspace Rakazo.xcworkspace -scheme Rakazo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee xcodebuild.log
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Rakazo.app Payload/
          zip -qry Rakazo-unsigned.ipa Payload
          unzip -l Rakazo-unsigned.ipa | head -30
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakazo-ipa-output
          path: |
            src/apps/mobile/ios/Rakazo-unsigned.ipa
            src/apps/mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 30
